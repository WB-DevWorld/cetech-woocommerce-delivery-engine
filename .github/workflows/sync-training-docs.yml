name: Sync training docs

on:
  push:
    branches:
      - master
    paths:
      - 'docs/training/**'
      - '.github/workflows/sync-training-docs.yml'
  workflow_dispatch:

concurrency:
  group: sync-training-docs
  cancel-in-progress: true

jobs:
  sync:
    name: Publish docs/training
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout training repository
        uses: actions/checkout@v4
        with:
          repository: wbdevworld/cetech-woocommerce-delivery-engine-training
          ssh-key: ${{ secrets.TRAINING_DOCS_DEPLOY_KEY }}
          path: training-docs

      - name: Publish docs/training
        working-directory: training-docs
        run: |
          set -euo pipefail

          # Replace published guides, but keep training-repo media that the
          # plugin repo gitignores (screenshots/videos under assets/).
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'assets' -exec rm -rf {} +
          cp -a ../plugin/docs/training/. ./
          if [ -d ../plugin/docs/training/assets ]; then
            mkdir -p assets
            cp -a ../plugin/docs/training/assets/. ./assets/
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No training-doc changes to publish."
            exit 0
          fi
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          git commit -m "Sync training docs from ${GITHUB_REPOSITORY}@${SHORT_SHA}"
          git push origin HEAD:main
