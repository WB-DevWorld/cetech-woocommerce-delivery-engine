name: RC11 Tag Publish

on:
  push:
    branches:
      - ops/rc11-package

permissions:
  contents: write

jobs:
  tag:
    name: Publish qualified v1.0.0-rc.11 tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen release source and tag absence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --tags --force
          master_sha=$(git rev-parse refs/remotes/origin/master)
          echo "origin/master=$master_sha"
          test "$master_sha" = "384f564f64a2db766ae6907392e95fb366fb8533"
          test "$(git cat-file -t 384f564f64a2db766ae6907392e95fb366fb8533)" = "commit"
          if git rev-parse --verify --quiet refs/tags/v1.0.0-rc.11 >/dev/null; then
            echo "v1.0.0-rc.11 already exists; refusing to recreate or move it." >&2
            exit 1
          fi

      - name: Create annotated RC.11 tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WB DevWorld Release Automation"
          git config user.email "109213646+wbdevworld@users.noreply.github.com"
          cat > "$RUNNER_TEMP/rc11-tag-message.txt" <<'EOF'
          CETECH WooCommerce Delivery Engine 1.0.0-rc.11

          Owner-qualified release candidate including accepted issue #18 PDP delivery pricing.
          Source: 384f564f64a2db766ae6907392e95fb366fb8533
          Schema: 5
          Final qualified ZIP SHA-256: 97423a95273f6148ee855d1fb8a66c6c66e47aa20cb2c5868ecf2f84b2a9a521
          Qualification run: 35145775218
          Clean install: PASS
          RC.10 -> RC.11 upgrade/data retention: PASS

          WPML/WCML certification remains separate.
          WP Rocket certification remains separate/unqualified.
          No FLAIROC, training, or production deployment is authorized by this tag.
          POS repository is outside scope.
          Stage 15 is not started.
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/rc11-tag-message.txt"
          git tag -a v1.0.0-rc.11 384f564f64a2db766ae6907392e95fb366fb8533 -F "$RUNNER_TEMP/rc11-tag-message.txt"
          tag_type=$(git cat-file -t refs/tags/v1.0.0-rc.11)
          peeled=$(git rev-parse 'v1.0.0-rc.11^{commit}')
          echo "tag_type=$tag_type peeled=$peeled"
          test "$tag_type" = "tag"
          test "$peeled" = "384f564f64a2db766ae6907392e95fb366fb8533"

      - name: Push tag only
        shell: bash
        run: |
          set -euo pipefail
          git push origin refs/tags/v1.0.0-rc.11
