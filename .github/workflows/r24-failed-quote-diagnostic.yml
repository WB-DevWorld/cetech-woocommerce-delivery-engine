name: R24 Failed Quote Receipt Diagnosis

on:
  push:
    branches:
      - 'ws3/r24-quote-receipt-diag-67c3ecc'

permissions:
  contents: read
  actions: read

concurrency:
  group: r24-quote-receipt-diag-67c3ecc
  cancel-in-progress: true

jobs:
  failed-receipt-diagnosis:
    name: Diagnose original failed quote receipts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout owned diagnostic tooling
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout exact failed candidate
        uses: actions/checkout@v4
        with:
          ref: 67c3ecc44cee0f5aa53a0090e49575ada46f7539
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast, hashlib
          from pathlib import Path
          expected = {
              'tooling/scripts/qualification/r24-originals-remote-bootstrap.py': 'd1fbdf4e4613bddb583285ac75288094d2638f48dfdd33b9550a330d6bf847af',
              'tooling/scripts/qualification/r24-failed-quote-diagnostic.py': 'c5b05e6172ef02c3bc7b367c18bc533d9b030410afe601ad5485ff47bfc5cdca',
          }
          for name, sha in expected.items():
              raw = Path(name).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == sha, name
              ast.parse(raw, filename=name)
          print('diagnostic_tooling_integrity=PASS')
          PY
      - name: Reproduce unchanged validator on authenticated original three archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK_DIAG_DIR: ${{ runner.temp }}/r24-quote-diag-40419092642
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/scripts/qualification/r24-failed-quote-diagnostic.py \
            --bootstrap "$GITHUB_WORKSPACE/tooling/scripts/qualification/r24-originals-remote-bootstrap.py" \
            --source "$GITHUB_WORKSPACE/candidate" \
            --directory "$TASK_DIAG_DIR"
          test -z "$(git -C candidate status --porcelain)"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          raw = (Path(os.environ['TASK_DIAG_DIR']) / 'r24-quote-failure-diagnostic.json').read_bytes()
          print('R24_QUOTE_DIAGNOSTIC_SHA256=' + hashlib.sha256(raw).hexdigest())
          print('R24_QUOTE_DIAGNOSTIC=' + json.dumps(json.loads(raw), sort_keys=True, separators=(',', ':')))
          PY
      - name: Check proposed producer regression and genuine old-fixture refusal
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/scripts/qualification/test-verify-quote-placement-receipts.py
          python3 - <<'PY'
          import importlib.util, sys, unittest
          from pathlib import Path
          from unittest.mock import patch
          path = Path('tooling/scripts/qualification/test-verify-quote-placement-receipts.py').resolve()
          spec = importlib.util.spec_from_file_location('r24_proposed_retained_regression', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          result = unittest.TestResult()
          with patch.object(module, 'HERE', Path('candidate/scripts/qualification').resolve()):
              module.ReceiptBoundaryTest('test_actual_lifecycle_case_keeps_frozen_retained_identity').run(result)
          assert result.testsRun == 1 and len(result.errors) == 1 and not result.failures
          assert 'RuntimeError: Retained Q05 inventory differs' in result.errors[0][1]
          print('genuine_old_fixture_regression=EXPECTED_RED tests=1; proposed_fixture=GREEN')
          PY
          test -z "$(git -C candidate status --porcelain)"
          test -z "$(git -C tooling status --porcelain)"
      - name: Verify Root MCP metadata and original SQL transport roundtrip
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROOT_RUN_SHA: 'd015113e475831557e50a3acd06380969dc88d30373d1db3a7fffc0d27567811'
          ROOT_JOBS_SHA: '31903cee962bccf9fbaad40d0b3fb9c3bd20e70e41ed8551b3a56d88ea60614b'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, os, sys
          from pathlib import Path
          source = Path('tooling/scripts/qualification/r24-originals-remote-bootstrap.py').resolve()
          spec = importlib.util.spec_from_file_location('r24_transport_preflight', source)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          token = os.environ.pop('GITHUB_TOKEN')
          base = 'https://api.github.com/repos/WB-DevWorld/cetech-woocommerce-delivery-engine'
          run = module.get_json(base + '/actions/runs/40419092642', token)
          jobs = module.get_json(base + '/actions/runs/40419092642/jobs?per_page=100&page=1', token)
          assert run['head_sha'] == '67c3ecc44cee0f5aa53a0090e49575ada46f7539' and run['conclusion'] == 'failure'
          assert jobs['total_count'] == 8
          assert module.digest(module.canonical(run)) == os.environ['ROOT_RUN_SHA'], 'Root MCP run bytes differ'
          assert module.digest(module.canonical(jobs)) == os.environ['ROOT_JOBS_SHA'], 'Root MCP jobs bytes differ'
          folder = Path(os.environ['RUNNER_TEMP']) / 'r24-transport-preflight-67'
          folder.mkdir(mode=0o700)
          module.download_exact(base + '/actions/jobs/121908700741/logs', token, folder / 'sql-original.log', 75379,
              '6bf96da91715cafb59db543608b62f9b49c90232055b0d4eb89f06900156b76d', module.MAX_SQL_LOG)
          print('root_mcp_rest_transport=PASS run=40419092642 parent_conclusion=failure sql_bytes=75379; candidate_qualification=false')
          PY
      - name: Preflight exact frozen auditor and isolated parser dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r24-audit-parser-check"
          "$RUNNER_TEMP/r24-audit-parser-check/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/r24-audit-parser-check/bin/python" - <<'PY'
          import hashlib, yaml
          from pathlib import Path
          raw = Path('tooling/scripts/qualification/root-r24-original-audit.py').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '5c10b54f11dc194704169d25d771dcee505482a32d83fdbc26dcf21a117670a3'
          assert yaml.__version__ == '6.0.3'
          print('frozen_auditor_and_isolated_parser=READY version=6.0.3; candidate_qualification=false')
          PY
          "$RUNNER_TEMP/r24-audit-parser-check/bin/python" tooling/scripts/qualification/root-r24-original-audit.py --help > /dev/null
      - name: Preserve bounded failed-candidate diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r24-quote-failed-originals-40419092642
          path: ${{ runner.temp }}/r24-quote-diag-40419092642/r24-quote-failure-diagnostic.json
          if-no-files-found: error
          retention-days: 30
