name: P05 Controlled Source Read Proof

on:
  push:
    branches:
      - 'ws3/p05-source-read-control/20261010-fixture-provenance'

permissions:
  contents: read

jobs:
  source-read-control:
    name: Exact old source RED / corrected source GREEN
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: sourceReadControlCiOnly
          MARIADB_DATABASE: cetech_operation_source_read_control
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.11'
          tools: composer:v2
          extensions: mysqli, pdo_mysql, zip
          coverage: none
      - name: Controlled physical source read proof and separate Composer dev installs
        env:
          CETECH_DE_REAL_DB_HOST: 127.0.0.1
          CETECH_DE_REAL_DB_PORT: 3306
          CETECH_DE_REAL_DB_USER: root
          CETECH_DE_REAL_DB_PASSWORD: sourceReadControlCiOnly
          CETECH_DE_REAL_DB_NAME: cetech_operation_source_read_control
        run: >-
          python3 scripts/qualification/run-source-read-control.py
          --repo "${GITHUB_WORKSPACE}"
          --report "${RUNNER_TEMP}/source-read-control-safe.json"
      - name: Upload only the closed safe structural proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05-controlled-source-read-proof
          path: ${{ runner.temp }}/source-read-control-safe.json
          if-no-files-found: error
          retention-days: 30
