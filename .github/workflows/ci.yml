name: Delivery Engine CI

# PHP policy: docs/PHP-RUNTIME-POLICY.md
# CETECH production target = PHP 8.5.x (blocking).
# PHP 8.1 = commercial minimum compatibility, not production.
# PHP 8.2 is no longer the principal PHPUnit gate.
# PHP 8.6 pre-release must not be added as a production target.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - 'ws1/**'
      - 'ws2/**'
      - 'ws3/**'
      - 'fix/**'
      - 'feat/**'
      - 'batch/**'

permissions:
  contents: read

concurrency:
  group: delivery-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  min-compat-php81:
    name: Minimum compatibility PHP 8.1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - name: Label this lane
        run: echo "MINIMUM COMPATIBILITY only. This is not the CETECH production PHP target."
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint runtime PHP at declared commercial minimum
        shell: bash
        run: bash scripts/ci-lint-php.sh cetech-woocommerce-delivery-engine.php uninstall.php src database
      - name: Lint application, tests and tooling
        shell: bash
        run: bash scripts/ci-lint-php.sh .
      - name: PHPUnit
        run: vendor/bin/phpunit
      - name: Verify team control plane on minimum PHP
        run: php scripts/verify-control-plane.php

  php-compat:
    name: PHP ${{ matrix.php }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            label: WooCommerce recommended-floor
          - php: '8.4'
            label: mature WooCommerce compatibility
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Show PHP version
        run: php -v
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint application, tests and tooling
        shell: bash
        run: bash scripts/ci-lint-php.sh .
      - name: PHPUnit
        run: vendor/bin/phpunit

  php85-primary:
    name: PHP 8.5 CETECH production target
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          extensions: zip, mbstring
      - name: Show PHP version
        run: |
          php -v
          php -r 'echo "php_major_minor=" . PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION, PHP_EOL;'
      - name: Reject PHP 8.6 pre-release as this job
        shell: bash
        run: |
          set -euo pipefail
          major_minor="$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
          test "$major_minor" = "8.5"
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Production PHP lint
        shell: bash
        run: bash scripts/ci-lint-php.sh cetech-woocommerce-delivery-engine.php uninstall.php src database
      - name: Lint application, tests and tooling
        shell: bash
        run: bash scripts/ci-lint-php.sh .
      - name: Full PHPUnit suite
        run: vendor/bin/phpunit
      - name: Production tree autoload and extracted PHP lint
        shell: bash
        run: bash scripts/ci-stage-production-tree.sh "${RUNNER_TEMP}/cetech-de-prod-tree"

  php85-mariadb:
    name: PHP 8.5 MariaDB geography/migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: geo11pass
          MARIADB_DATABASE: cetech_geo11
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, zip
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Fail if MariaDB is not reachable
        env:
          CETECH_DE_REAL_DB_HOST: 127.0.0.1
          CETECH_DE_REAL_DB_PORT: 3306
          CETECH_DE_REAL_DB_USER: root
          CETECH_DE_REAL_DB_PASSWORD: geo11pass
          CETECH_DE_REAL_DB_NAME: cetech_geo11
        run: |
          php -r '
            require "vendor/autoload.php";
            $db = CetechDeliveryEngine\Tests\Support\RealMysqliWpdb::try_connect();
            if ( ! $db instanceof CetechDeliveryEngine\Tests\Support\RealMysqliWpdb ) {
              fwrite(STDERR, "MariaDB preflight failed on PHP 8.5\n");
              exit(1);
            }
            echo "mariadb_preflight=ok\n";
          '
      - name: Real MariaDB / geography / migration proofs
        env:
          CETECH_DE_REAL_DB_HOST: 127.0.0.1
          CETECH_DE_REAL_DB_PORT: 3306
          CETECH_DE_REAL_DB_USER: root
          CETECH_DE_REAL_DB_PASSWORD: geo11pass
          CETECH_DE_REAL_DB_NAME: cetech_geo11
        run: |
          vendor/bin/phpunit \
            -c phpunit.real-db.xml \
            --log-junit "${RUNNER_TEMP}/cetech-de-real-db.junit.xml"
          php -r '
            $file = getenv("RUNNER_TEMP") . "/cetech-de-real-db.junit.xml";
            $xml = simplexml_load_file($file);
            if ( ! $xml ) {
              fwrite(STDERR, "missing real-db JUnit log\n");
              exit(1);
            }
            $tests = (int) $xml["tests"];
            $skipped = (int) $xml["skipped"];
            $failures = (int) $xml["failures"];
            $errors = (int) $xml["errors"];
            $executed = $tests - $skipped;
            echo "real_db tests={$tests} skipped={$skipped} executed={$executed} failures={$failures} errors={$errors}\n";
            if ( $failures > 0 || $errors > 0 ) {
              exit(1);
            }
            if ( $executed < 5 ) {
              fwrite(STDERR, "too few real MariaDB tests executed on PHP 8.5\n");
              exit(1);
            }
          '

  php85-wordpress:
    name: PHP 8.5 WordPress/WooCommerce activation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: wordpress
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          extensions: mysqli, pdo_mysql, zip, mbstring, intl, xml, curl, gd, soap, bcmath
      - name: WordPress bootstrap, WooCommerce, HPOS, Store API, upgrade from RC.12
        env:
          CETECH_DE_WP_DB_HOST: 127.0.0.1
          CETECH_DE_WP_DB_PORT: 3306
          CETECH_DE_WP_DB_USER: root
          CETECH_DE_WP_DB_PASSWORD: wordpress
        shell: bash
        run: bash scripts/ci-wordpress-php85-smoke.sh

  javascript-tests:
    name: JavaScript / Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Vitest
        run: npm run test:js

  control-plane:
    name: Control Plane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify team control plane
        run: php scripts/verify-control-plane.php
      - name: Verify product control plane
        run: node scripts/verify-product-control-plane.mjs --self-test

  legacy-required-php81:
    name: Runtime PHP 8.1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [min-compat-php81]
    if: ${{ always() }}
    steps:
      - name: Alias for existing GitHub required checks
        run: |
          echo "MINIMUM COMPATIBILITY lane. Not the CETECH production PHP target."
          test "${{ needs.min-compat-php81.result }}" = "success"

  legacy-required-php82:
    name: PHP / PHPUnit 8.2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [php85-primary]
    if: ${{ always() }}
    steps:
      - name: Alias so historical rulesets still require the principal PHP gate
        run: |
          echo "PHP 8.2 is no longer the principal PHPUnit gate."
          echo "This alias fails unless PHP 8.5 CETECH production target succeeded."
          test "${{ needs.php85-primary.result }}" = "success"

  ci-required-gates:
    name: CI required gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - min-compat-php81
      - php-compat
      - php85-primary
      - php85-mariadb
      - php85-wordpress
      - javascript-tests
      - control-plane
    steps:
      - name: Require PHP 8.5 production target and supporting lanes
        run: |
          set -euo pipefail
          echo "min-compat=${{ needs.min-compat-php81.result }}"
          echo "php-compat=${{ needs.php-compat.result }}"
          echo "php85-primary=${{ needs.php85-primary.result }}"
          echo "php85-mariadb=${{ needs.php85-mariadb.result }}"
          echo "php85-wordpress=${{ needs.php85-wordpress.result }}"
          echo "javascript=${{ needs.javascript-tests.result }}"
          echo "control-plane=${{ needs.control-plane.result }}"
          test "${{ needs.min-compat-php81.result }}" = "success"
          test "${{ needs.php-compat.result }}" = "success"
          test "${{ needs.php85-primary.result }}" = "success"
          test "${{ needs.php85-mariadb.result }}" = "success"
          test "${{ needs.php85-wordpress.result }}" = "success"
          test "${{ needs.javascript-tests.result }}" = "success"
          test "${{ needs.control-plane.result }}" = "success"
